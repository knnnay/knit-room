<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>다락방 뜨개 아지트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --surface:rgba(255,255,255,.9); --solid:#fff; --ink:#1f1f1f; --muted:#8d8d8d;
    --line:rgba(0,0,0,.09); --hover:rgba(0,0,0,.05); --invert:#fff;
    --gap:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{background:#1c140e;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-weight:400;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;transition:background .6s}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #scene:active{cursor:grabbing}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .glass{background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

  /* 상단 */
  .top{position:fixed;top:calc(var(--gap) + env(safe-area-inset-top));left:calc(var(--gap) + env(safe-area-inset-left));right:calc(var(--gap) + env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
  .top>*{pointer-events:auto}
  .brand{padding:8px 14px;border-radius:12px;min-width:0}
  .brand .name{font-weight:500;font-size:14px;white-space:nowrap}
  .brand .sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iconbar{position:relative;flex:none;display:flex;align-items:center;gap:2px;padding:4px;border-radius:12px}
  .div{width:1px;height:18px;background:var(--line);margin:0 4px}
  .ib{width:36px;height:36px;flex:none;border:none;background:none;border-radius:9px;display:grid;place-items:center;transition:background .15s,color .15s}
  .ib:hover{background:var(--hover)}
  .ib[aria-pressed="true"],.ib[aria-expanded="true"]{background:var(--ink);color:var(--invert)}
  .ib.sm{width:32px;height:32px;border-radius:8px}
  .pop{position:absolute;top:calc(100% + 8px);right:0;width:220px;background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px;z-index:5}
  .pop[hidden]{display:none}
  .pop button{display:flex;align-items:center;gap:10px;border:none;background:none;border-radius:8px;padding:8px 10px;text-align:left}
  .pop button:hover{background:var(--hover)}
  .pop .t{font-size:13.5px}
  .pop .d{display:block;font-size:11px;color:var(--muted)}
  .pop .e{font-size:18px;width:24px;text-align:center}
  .pop .ck{margin-left:auto;opacity:0}
  .pop button.sel .ck{opacity:1}

  /* 하단 바 */
  #bar{position:fixed;left:50%;bottom:calc(var(--gap) + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(620px,calc(100% - var(--gap) * 2));display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;grid-template-areas:"av pj ct tm";align-items:center;column-gap:12px;row-gap:8px;padding:8px 10px;border-radius:16px}
  .avatar{grid-area:av;width:40px;height:40px;border:none;border-radius:10px;background:var(--hover);padding:0;overflow:hidden;display:grid;place-items:center}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  #project{grid-area:pj;width:100%;min-width:0;border:none;background:transparent;outline:none;font-size:16px;padding:6px 2px}
  #project::placeholder{color:var(--muted)}
  .counter{grid-area:ct;display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid var(--line)}
  .timer{grid-area:tm;display:flex;align-items:center;gap:2px;padding-left:12px;border-left:1px solid var(--line)}
  .step{width:36px;height:36px;flex:none;border:none;border-radius:50%;background:var(--ink);color:var(--invert);display:grid;place-items:center;transition:transform .1s,opacity .15s}
  .step svg{width:16px;height:16px;stroke-width:2}
  .step:active{transform:scale(.9)}
  .step:disabled{opacity:.25;cursor:default}
  .num{min-width:48px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
  .num b{font-weight:500;font-size:22px}
  .num small{font-size:12px;color:var(--muted);margin-left:2px}
  #timeText{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);min-width:64px;text-align:right;margin-right:4px}
  .timer.running #timeText{color:var(--ink)}

  /* 이름표 */
  .tag{position:absolute;left:0;top:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px 4px;font-size:11px;white-space:nowrap;text-align:center;line-height:1.4;transition:opacity .2s}
  .tag .nm{display:block;color:var(--muted);font-size:10px}
  .tag .pj{max-width:130px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
  .tag .rw{font-weight:500;margin-left:4px;display:inline-block}
  .tag.me{background:var(--ink);color:var(--invert);border-color:var(--ink)}
  .tag.me .nm{color:rgba(255,255,255,.6)}
  .tag .rw.bump{animation:bump .45s}
  @keyframes bump{35%{transform:scale(1.4)}}

  /* 대화상자 공통 */
  dialog{border:1px solid var(--line);border-radius:16px;background:var(--solid);color:var(--ink);padding:22px;width:min(420px,calc(100% - 24px));max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(10,6,3,.45);backdrop-filter:blur(2px)}
  dialog h2{margin:0;font-size:16px;font-weight:500}
  .lbl{display:block;font-size:12px;color:var(--muted);margin:14px 0 8px}
  .text{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--solid);outline:none;font-size:16px}
  .text:focus{border-color:var(--ink)}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;border:none;background:none;border-radius:7px;padding:9px;font-size:13px;color:var(--muted)}
  .seg button.sel{background:var(--ink);color:var(--invert)}
  .primary{width:100%;border:none;background:var(--ink);color:var(--invert);border-radius:10px;padding:12px;font-size:14px}
  .ghost{width:100%;border:1px solid var(--line);background:var(--solid);border-radius:10px;padding:12px;font-size:14px}
  .chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--muted)}
  .chip:hover{background:var(--hover)}
  .chip.sel{background:var(--ink);color:var(--invert);border-color:var(--ink)}

  /* 확인창 */
  #confirm{width:min(320px,calc(100% - 32px))}
  #confirm p{margin:0 0 18px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
  .cbtns{display:flex;gap:8px}

  /* 캐릭터 만들기 */
  #welcome{width:min(560px,calc(100% - 24px));padding:0}
  #wform{padding:20px 22px 0}
  .maker{display:grid;grid-template-columns:168px minmax(0,1fr);gap:18px;align-items:start;margin-top:16px}
  .pvwrap{position:relative;width:168px;height:168px}
  #pv{width:168px;height:168px;border-radius:14px;background:radial-gradient(circle at 50% 38%,#ffffff,#efe9e1);display:block}
  #pvRandom{position:absolute;right:6px;bottom:6px;background:var(--solid);border:1px solid var(--line)}
  .maker .lbl:first-child{margin-top:0}
  .presets{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
  .presets button{border:1px solid var(--line);background:var(--solid);border-radius:8px;font-size:18px;aspect-ratio:1;padding:0;display:grid;place-items:center}
  .presets button.sel{border-color:var(--ink);background:var(--hover)}
  .msec{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
  .msec h3{margin:0 0 12px;font-size:13px;font-weight:500}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;border:none;background:none;padding:8px 10px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tabs button.sel{color:var(--ink);border-bottom-color:var(--ink)}
  .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cbox{border:1px solid var(--line);border-radius:12px;padding:12px}
  .cbox small{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}
  .swgrid{display:grid;grid-template-columns:repeat(auto-fill,28px);gap:8px}
  .swgrid button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.14);padding:0}
  .swgrid button.sel{box-shadow:0 0 0 2px var(--ink)}
  .cpick{width:28px;height:28px;border:none;padding:0;border-radius:50%;background:conic-gradient(#f44,#fa3,#fe4,#5d5,#4bf,#56f,#b5f,#f44);cursor:pointer;-webkit-appearance:none;appearance:none}
  .cpick::-webkit-color-swatch-wrapper{padding:4px}
  .cpick::-webkit-color-swatch{border:none;border-radius:50%}
  .cpick::-moz-color-swatch{border:none;border-radius:50%}
  .mfoot{position:sticky;bottom:0;background:var(--solid);padding:14px 22px 20px;margin:18px -22px 0;box-shadow:0 -1px 0 var(--line)}
  #wform{outline:none}
  @media (max-width:600px){.mfoot{padding:14px 16px 16px;margin:18px -16px 0}}

  #toast{position:fixed;top:calc(72px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-6px);background:var(--ink);color:var(--invert);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 휴대폰 */
  @media (max-width:600px){
    :root{--gap:10px}
    #bar{grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"av pj pj" "ct ct tm"}
    .counter{border-left:none;padding-left:0}
    .tag{font-size:10px}
    .tag .pj{max-width:84px}
    .maker{grid-template-columns:1fr}
    .pvwrap{justify-self:center}
    .cgrid{grid-template-columns:1fr}
    #wform{padding:18px 16px 0}
  }
  @media (max-width:420px){
    .counter{gap:4px}
    .step{width:34px;height:34px}
    .num{min-width:38px}
    .timer{gap:0;padding-left:8px}
    #timeText{min-width:0;font-size:13px}
    .ib.sm{width:30px;height:30px}
  }
  @media (max-width:360px){
    .brand .sub{display:none}
  }
  /* 가로로 눕힌 휴대폰 */
  @media (max-height:480px) and (orientation:landscape){
    :root{--gap:8px}
    #bar{width:min(620px,calc(100% - 16px))}
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="뜨개방 3D 장면"></canvas>
<div id="labels"></div>

<header class="top">
  <div class="brand glass">
    <div class="name" id="roomName">겨울 다락방</div>
    <div class="sub" id="roomSub">연결 중…</div>
  </div>
  <nav class="iconbar glass">
    <button class="ib" id="themeBtn" data-i="theme" title="테마" aria-label="테마 바꾸기" aria-expanded="false"></button>
    <div class="pop" id="themePop" hidden></div>
    <span class="div"></span>
    <button class="ib" data-sound="rain" data-i="rain" title="빗소리" aria-label="빗소리" aria-pressed="false"></button>
    <button class="ib" data-sound="fire" data-i="fire" title="장작 소리" aria-label="장작 타는 소리" aria-pressed="false"></button>
    <span class="div"></span>
    <button class="ib" id="inviteBtn" data-i="link" title="초대 링크 복사" aria-label="초대 링크 복사"></button>
  </nav>
</header>

<section id="bar" class="glass">
  <button id="meBadge" class="avatar" title="캐릭터 꾸미기" aria-label="캐릭터 꾸미기"></button>
  <input id="project" maxlength="30" placeholder="작품 이름" aria-label="작품 이름">
  <div class="counter">
    <button id="minus" class="step" data-i="minus" aria-label="한 단 빼기"></button>
    <span class="num"><b id="rowsNum">0</b><small>단</small></span>
    <button id="plus" class="step" data-i="plus" aria-label="한 단 더하기"></button>
    <button id="rReset" class="ib sm" data-i="reset" aria-label="단수 초기화" title="단수 초기화"></button>
  </div>
  <div class="timer" id="timer">
    <span id="timeText">00:00:00</span>
    <button id="tPlay" class="ib sm" data-i="play" aria-label="타이머 시작"></button>
    <button id="tReset" class="ib sm" data-i="reset" aria-label="타이머 초기화" title="초기화"></button>
  </div>
</section>

<dialog id="welcome">
  <form id="wform">
    <h2 id="wtitle">캐릭터 만들기</h2>
    <div class="maker">
      <div class="pvwrap">
        <canvas id="pv" aria-label="캐릭터 미리보기"></canvas>
        <button type="button" class="ib sm" id="pvRandom" data-i="dice" title="랜덤으로 만들기" aria-label="랜덤으로 만들기"></button>
      </div>
      <div>
        <label class="lbl" for="wname">닉네임</label>
        <input id="wname" class="text" maxlength="10" required placeholder="예: 솜뭉치">
        <span class="lbl">십이지에서 시작하기</span>
        <div class="presets" id="wpreset"></div>
      </div>
    </div>
    <section class="msec">
      <h3>부위 꾸미기</h3>
      <div class="tabs" id="wtabs" role="tablist"></div>
      <div class="opts" id="wopts"></div>
    </section>
    <section class="msec">
      <h3>색</h3>
      <div class="cgrid">
        <div class="cbox"><small>몸 색</small><div class="swgrid" id="wfur"></div></div>
        <div class="cbox"><small>포인트 색</small><div class="swgrid" id="wacc"></div></div>
      </div>
    </section>
    <section class="msec">
      <h3>도구</h3>
      <div class="seg" id="wtool"></div>
    </section>
    <div class="mfoot"><button class="primary" type="submit" id="wsubmit">들어가기</button></div>
  </form>
</dialog>

<dialog id="confirm">
  <p id="cmsg"></p>
  <div class="cbtns"><button class="ghost" id="cno" type="button">취소</button><button class="primary" id="cok" type="button">확인</button></div>
</dialog>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   Supabase 연결 정보 (Project Settings → API 에서 복사)
   - URL: https://xxxx.supabase.co
   - KEY: anon(public) 키 또는 publishable 키 (공개용 키라 페이지에 넣어도 괜찮아요)
   비워두면 친구 없이 혼자 보는 '체험 모드'로 열려요.
   ========================================================= */
const SUPABASE_URL = '';
const SUPABASE_KEY = '';
</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- 아이콘 ---------- */
const ICON = {
  theme: '<svg viewBox="0 0 24 24"><path d="M3.5 18.5l5.5-7.5 3.8 5 2.7-3.2 5 5.7z"/><circle cx="16" cy="7" r="2"/></svg>',
  rain: '<svg viewBox="0 0 24 24"><path d="M7 14.5a4 4 0 1 1 .8-7.9A5 5 0 0 1 17.5 7.5a3.5 3.5 0 0 1-.5 7H7z"/><path d="M8.5 18l-1 2.5M12.5 18l-1 2.5M16.5 18l-1 2.5"/></svg>',
  fire: '<svg viewBox="0 0 24 24"><path d="M12 21c-3.9 0-6-2.5-6-5.5 0-3.5 3-5 3-8.5 2 1 3.5 3 3.5 5 1-1 1.5-2 1.5-3.5 2 1.5 4 4.2 4 7 0 3-2.1 5.5-6 5.5z"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M9 5.5v13M15 5.5v13"/></svg>',
  reset: '<svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v3.8h3.8"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  minus: '<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
  dice: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="9" cy="15" r="1" fill="currentColor"/><circle cx="15" cy="15" r="1" fill="currentColor"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  link: '<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
};
document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = ICON[el.dataset.i]; });

/* ---------- 저장 (시제품: 이 브라우저에 저장) ---------- */
const KEY = 'knit-attic:v1';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};

/* ---------- 확인창 (브라우저 confirm 대신) ---------- */
function ask(msg, okLabel = '확인') {
  return new Promise(res => {
    const d = $('#confirm');
    $('#cmsg').textContent = msg; $('#cok').textContent = okLabel;
    const done = v => { d.onclose = null; if (d.open) d.close(); res(v); };
    $('#cok').onclick = () => done(true);
    $('#cno').onclick = () => done(false);
    d.onclose = () => res(false);
    d.showModal();
  });
}

/* ---------- 캐릭터 파츠 ---------- */
const PARTS = {
  ears:    { ko: '귀', opts: { none: '없음', round: '동글귀', pointy: '쫑긋귀', long: '토끼귀', floppy: '늘어진귀', mouse: '큰 귀', side: '옆귀', monkey: '원숭이귀', pig: '접힌귀', fin: '지느러미' } },
  snout:   { ko: '주둥이', opts: { nose: '콧망울', muzzle: '동글 주둥이', long: '긴 주둥이', ox: '넓은 코', pig: '돼지코', beak: '부리', mask: '얼굴 무늬', tongue: '혀' } },
  horns:   { ko: '뿔', opts: { none: '없음', small: '작은 뿔', dragon: '용뿔', unicorn: '외뿔', antler: '사슴뿔' } },
  top:     { ko: '머리', opts: { none: '없음', mane: '갈기', comb: '볏', wool: '양털', tuft: '삐침머리' } },
  pattern: { ko: '무늬', opts: { none: '없음', stripes: '줄무늬', spots: '얼룩', belly: '배 무늬' } },
  tail:    { ko: '꼬리', opts: { none: '없음', pom: '방울꼬리', long: '긴 꼬리', curl: '돌돌꼬리', spikes: '등가시', feathers: '꽁지깃', coil: '똬리' } },

      g.fillRect(0, i * rh, w, rh);
      g.strokeStyle = 'rgba(70,35,15,.12)'; g.lineWidth = 1.5;

  // 팔레트에 없는 색은 직접 고르기
  const inp = document.createElement('input'); inp.type = 'color'; inp.className = 'cpick'; inp.value = cur;
  inp.setAttribute('aria-label', '색 직접 고르기'); inp.title = '색 직접 고르기';
  if (!cols.includes(cur)) inp.style.boxShadow = '0 0 0 2px var(--ink)';
  inp.addEventListener('input', () => { draft.look[key] = inp.value; draft.preset = null; setPreviewAvatar(draft.look, draft.tool); });
  inp.addEventListener('change', () => renderMaker());
  el.append(inp);
}
function renderMaker() {
  const pre = $('#wpreset'); pre.innerHTML = '';
  Object.entries(PRESETS).forEach(([k, z]) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = z.e; b.title = z.ko; b.setAttribute('aria-label', z.ko);
    b.className = draft.preset === k ? 'sel' : '';
    b.onclick = () => { draft.look = lookOf(k); draft.preset = k; renderMaker(); };
    pre.append(b);
  });
  const tabs = $('#wtabs'); tabs.innerHTML = '';
  Object.entries(PARTS).forEach(([k, part]) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = part.ko; b.setAttribute('role', 'tab');
    b.className = editTab === k ? 'sel' : ''; b.onclick = () => { editTab = k; renderMaker(); };
    tabs.append(b);
  });
  const opts = $('#wopts'); opts.innerHTML = '';
  Object.entries(PARTS[editTab].opts).forEach(([k, label]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (draft.look[editTab] === k ? ' sel' : '');
    b.textContent = label; b.onclick = () => { draft.look[editTab] = k; draft.preset = null; renderMaker(); };
    opts.append(b);
  });
  swatchRow($('#wfur'), FURS, 'fur'); swatchRow($('#wacc'), ACCS, 'acc');
  const tl = $('#wtool'); tl.innerHTML = '';
  Object.entries(TOOLS).forEach(([k, label]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = draft.tool === k ? 'sel' : ''; b.textContent = label;
    b.onclick = () => { draft.tool = k; renderMaker(); };
    tl.append(b);
  });
  setPreviewAvatar(draft.look, draft.tool);
}
$('#pvRandom').onclick = () => {
  const r = {};
  Object.entries(PARTS).forEach(([k, part]) => { const keys = Object.keys(part.opts); r[k] = (keys.includes('none') && Math.random() < 0.45) ? 'none' : pick(keys); });
  draft.look = Object.assign(r, { fur: pick(FURS), acc: pick(ACCS) }); draft.preset = null; renderMaker();
};
function openMaker() {
  draft = { tool: me.tool, look: Object.assign({}, me.look), preset: me.preset };
  $('#wname').value = me.name;
  $('#wtitle').textContent = me.name ? '캐릭터 꾸미기' : '다락방에 들어가기';
  $('#wsubmit').textContent = me.name ? '저장' : '들어가기';
  renderMaker();
  $('#welcome').showModal();
  initPreview().run = true; previewLoop();
}
$('#welcome').addEventListener('cancel', e => { if (!me.name) e.preventDefault(); });
$('#welcome').addEventListener('close', () => { if (pv) pv.run = false; });
$('#wform').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#wname').value.trim(); if (!name) return;
  const first = !me.name;
  Object.assign(me, { name, tool: draft.tool, look: draft.look, preset: draft.preset }); saveMe();
  $('#welcome').close();
  placeAvatar(mine); renderTag(mine); updateBadge();
  if (first) { connect(); setTimeout(() => toast('드래그로 둘러보기 · 휠이나 두 손가락으로 확대'), 800); }
  else queueTrack();
});
$('#meBadge').onclick = openMaker;

/* ---------- 함께 쓰기 (Supabase Realtime 현재 접속자 기능) ----------
   서버에 표를 만들 필요 없이, 같은 방 코드에 들어온 사람들끼리
   이름·캐릭터·작품·단수·테마를 실시간으로 주고받아요.
   각자의 기록은 각자 기기에 저장돼요. */
let channel = null, connected = false, trackTimer = null;
const HEX = /^#[0-9a-f]{6}$/i;
function payload() {
  return { id: me.id, name: me.name, look: me.look, tool: me.tool, yarn: me.yarn, project: me.project, rows: me.rows, theme: me.theme, themeAt: me.themeAt, joinedAt: me.joinedAt };
}
function queueTrack(delay = 150) {
  if (!channel || !connected || !me.name) return;
  clearTimeout(trackTimer);
  trackTimer = setTimeout(() => channel.track(payload()).catch(() => {}), delay);
}
// 다른 사람이 보낸 값은 믿지 않고 정리해서 씀
function clean(m) {
  const look = lookOf('rabbit');
  if (m.look && typeof m.look === 'object') {
    Object.keys(PARTS).forEach(k => { if (PARTS[k].opts[m.look[k]]) look[k] = m.look[k]; });
    if (HEX.test(m.look.fur)) look.fur = m.look.fur.toLowerCase();
    if (HEX.test(m.look.acc)) look.acc = m.look.acc.toLowerCase();
  }
  return {
    id: String(m.id).slice(0, 64), name: String(m.name || '친구').slice(0, 10), look,
    tool: TOOLS[m.tool] ? m.tool : 'knit', yarn: HEX.test(m.yarn) ? m.yarn : '#e98aa6',
    project: String(m.project || '').slice(0, 30), rows: clamp(Math.floor(+m.rows || 0), 0, 999999),
    theme: THEMES[m.theme] ? m.theme : 'attic', themeAt: +m.themeAt || 0, joinedAt: +m.joinedAt || Date.now(),
  };
}
function updateSub(n, total) {
  const sub = $('#roomSub');
  if (!ONLINE) { sub.textContent = '체험 모드 · 친구는 가짜예요'; return; }
  if (!me.name) { sub.textContent = `방 ${ROOM}`; return; }
  if (!connected) { sub.textContent = `방 ${ROOM} · 연결 중…`; return; }
  sub.textContent = `${n}명 · 방 ${ROOM}` + (total > n ? ` (자리 없음 ${total - n}명)` : '');
}
function removePerson(p) {
  if (p.group) { scene.remove(p.group); disposeTree(p.group); }
  p.tag.remove(); people.splice(people.indexOf(p), 1);
}
function onSync() {
  const st = channel.presenceState();
  const list = Object.values(st).map(metas => metas[metas.length - 1]).filter(m => m && m.id).map(clean);
  if (!list.some(m => m.id === me.id)) list.push(clean(payload()));
  list.sort((a, b) => a.joinedAt - b.joinedAt || (a.id < b.id ? -1 : 1));
  // 먼저 온 순서대로 앉되, 자리가 모자라도 나는 항상 앉음
  let seated = list.slice(0, MAX_SEATS);
  if (!seated.some(d => d.id === me.id)) seated = [...list.filter(d => d.id !== me.id).slice(0, MAX_SEATS - 1), list.find(d => d.id === me.id)];
  const seen = new Set();
  seated.forEach((d, seat) => {
    seen.add(d.id);
    if (d.id === me.id) { if (mine.seat !== seat) { mine.seat = seat; placeAvatar(mine); } return; }
    let p = people.find(q => q.id === d.id);
    if (!p) { p = { id: d.id, data: d, seat, isMe: false, group: null }; people.push(p); makeTag(p); placeAvatar(p); return; }
    const looksChanged = JSON.stringify([p.data.look, p.data.tool, p.data.yarn]) !== JSON.stringify([d.look, d.tool, d.yarn]);
    const rowsUp = d.rows > p.data.rows;
    p.data = d;
    if (looksChanged || p.seat !== seat) { p.seat = seat; placeAvatar(p); }
    renderTag(p, rowsUp);
    if (rowsUp && p.group) p.group.userData.jump = 0.5;
  });
  people.filter(p => !p.isMe && !seen.has(p.id)).forEach(removePerson);
  // 방 테마 = 가장 최근에 테마를 바꾼 사람의 것
  const latest = list.reduce((a, b) => (b.themeAt > a.themeAt ? b : a), list[0]);
  if (latest && latest.id !== me.id && latest.themeAt > me.themeAt && latest.theme !== me.theme) {
    me.themeAt = latest.themeAt; setTheme(latest.theme, true);
    toast(`${latest.name}님이 테마를 ${THEMES[latest.theme].ko}(으)로 바꿨어요`);
  }
  updateSub(seated.length, list.length);
}
function connect() {
  if (!ONLINE || channel || !me.name) { updateSub(1, 1); return; }
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  channel = sb.channel('knit-room:' + ROOM, { config: { presence: { key: me.id } } });
  channel.on('presence', { event: 'sync' }, onSync);
  channel.subscribe(status => {
    if (status === 'SUBSCRIBED') {
      const was = connected; connected = true;
      channel.track(payload()).catch(() => {});
      if (!was) updateSub(1, 1);
    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
      connected = false; updateSub(0, 0);
    }
  });
  updateSub(0, 0);
}

// 초대 링크 복사
$('#inviteBtn').onclick = async () => {
  const url = location.href;
  try { await navigator.clipboard.writeText(url); toast('초대 링크를 복사했어요. 친구에게 보내주세요'); }
  catch (e) { await ask('이 주소를 친구에게 보내주세요:\n' + url, '확인'); }
};

/* ---------- 가짜 친구들 (체험 모드 전용) ---------- */
if (!ONLINE) (function friendRows() {
  setTimeout(() => {
    const p = pick(people.filter(q => !q.isMe));
    p.data.rows++; renderTag(p, true); if (p.group) p.group.userData.jump = 0.5;
    friendRows();
  }, rnd(6000, 14000));
})();

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- 렌더 루프 ---------- */
const v = new THREE.Vector3();
function updateTags() {
  const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
  people.forEach(p => {
    if (!p.group) { p.tag.style.opacity = 0; return; }
    p.group.userData.head.getWorldPosition(v); v.y += 0.78; v.project(camera);
    const x = (v.x * 0.5 + 0.5) * w, y = (-v.y * 0.5 + 0.5) * h;
    p.tag.style.transform = `translate(${x}px,${y}px) translate(-50%,-100%)`;
    p.tag.style.opacity = v.z < 1 ? 1 : 0;
  });
}
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  people.forEach(p => { if (p.group) animateAvatar(p.group, p.isMe ? (running ? 7 : 1.2) : 5.5, dt, t); });
  env.update(t, dt);
  applyCam(); updateFade();
  renderer.render(scene, camera);
  updateTags();
  requestAnimationFrame(loop);
}

people.forEach(makeTag);
renderThemePop();
setTheme(me.theme, true);
updateSub(1, 1);
if (me.name) { updateBadge(); connect(); } else openMaker();
loop();
})();
</script>
